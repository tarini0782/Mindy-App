include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # These matter for a research prototype that must not mislead:
    # an unused result or a dead branch in the adaptive engine is a bug.
    unused_import: warning
    unused_local_variable: warning
    dead_code: warning
  exclude:
    - build/**
    - "**/*.g.dart"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Kept deliberately small. The goal is catching real mistakes,
    # not enforcing style on 131 existing files.
    avoid_print: true
    prefer_const_constructors: false
    use_build_context_synchronously: true
